name: nutrilabel_ai
description: AI-powered nutrition label analysis mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.0

  # Navigation
  go_router: ^12.0.0

  # HTTP client
  dio: ^5.3.0
  http_parser: ^4.1.2

  # Secure token storage
  flutter_secure_storage: ^9.0.0

  # Image picking (camera + gallery)
  image_picker: ^1.0.4

  # Cached images
  cached_network_image: ^3.3.0

  # Environment variables
  flutter_dotenv: ^5.1.0

  # Supabase for authentication (login/signup/forgot password)
  supabase_flutter: ^2.3.0

  # UI extras
  cupertino_icons: ^1.0.2
  intl: ^0.19.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/.env
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
